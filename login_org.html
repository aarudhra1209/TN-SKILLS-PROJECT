<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRM & ERP Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eff6ff;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #172554;
        }

        p {
            text-align: center;
            color: #64748b;
            margin: 10px 0 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <h1>CRM & ERP</h1>

        <p>Business Management System</p>


        <form onsubmit="return loginUser()">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>


    <script>

        function loginUser() {

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;


            if (username === "admin" && password === "1234") {

                alert("Login successful!");

                window.location.href = "org_crm.html";

                return false;

            }

            else {

                alert("Invalid username or password!");

                return false;

            }

        }

    </script>

</body>

</html>
